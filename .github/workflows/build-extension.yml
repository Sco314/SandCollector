# WhyDOM extension build and test artifact workflow
name: Build WhyDOM Extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - manifest.json
      - src/**
      - tests/**
      - .github/workflows/build-extension.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manifest and required files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          manifest_path = root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          assert manifest.get('manifest_version') == 3, 'manifest_version must be 3'
          assert manifest.get('name') == 'WhyDOM', 'Unexpected extension name'

          required = [
              Path('manifest.json'),
              Path('src/background/service-worker.js'),
              Path('src/content/element-snapshot.js'),
              Path('src/content/capture-quality.js'),
              Path('src/content/capture-safety.js'),
              Path('src/content/copy-polish.js'),
              Path('src/content/selector-consistency.js'),
              Path('src/content/overflow-diagnostic.js'),
              Path('src/content/overflow-precision.js'),
              Path('src/content/picker.js'),
              Path('src/content/picker.css'),
              Path('src/panel/panel.html'),
              Path('src/panel/panel.css'),
              Path('src/panel/panel.js'),
              Path('src/panel/why.css'),
              Path('src/panel/why-panel.js'),
              Path('tests/fixtures/overflow-lab.html'),
          ]

          missing = [str(path) for path in required if not (root / path).is_file()]
          if missing:
              raise SystemExit('Missing required extension files: ' + ', '.join(missing))

          service_worker = manifest.get('background', {}).get('service_worker')
          if not service_worker or not (root / service_worker).is_file():
              raise SystemExit(f'Invalid background service worker path: {service_worker!r}')

          panel_path = manifest.get('side_panel', {}).get('default_path')
          if not panel_path or not (root / panel_path).is_file():
              raise SystemExit(f'Invalid side panel path: {panel_path!r}')

          print(f"Validated {manifest['name']} v{manifest['version']} (Manifest V3)")
          PY

      - name: Syntax check extension JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check src/background/service-worker.js
          node --check src/content/element-snapshot.js
          node --check src/content/capture-quality.js
          node --check src/content/capture-safety.js
          node --check src/content/copy-polish.js
          node --check src/content/selector-consistency.js
          node --check src/content/overflow-diagnostic.js
          node --check src/content/overflow-precision.js
          node --check src/content/picker.js
          node --check src/panel/panel.js
          node --check src/panel/why-panel.js

      - name: Build unpacked extension directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/WhyDOM
          cp manifest.json dist/WhyDOM/
          cp -R src dist/WhyDOM/

      - name: Create WhyDOM ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd dist/WhyDOM
          zip -r ../WhyDOM.zip .

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: WhyDOM-unpacked
          path: dist/WhyDOM
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaged ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WhyDOM-zip
          path: dist/WhyDOM.zip
          if-no-files-found: error
          retention-days: 14
